name: DraCaveTitle
main: com.dracave.title.DraCaveTitlePlugin
version: 1.1.3
api-version: "1.21"
authors: [SilinThoakes]
description: 称号仓库、商店、自定义称号一体化插件（Vault / PlayerPoints / 称号币，MySQL / SQLite 存储）
folia-supported: true
softdepend: [PlaceholderAPI, Vault, PlayerPoints]
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - com.mysql:mysql-connector-j:8.4.0
  - org.xerial:sqlite-jdbc:3.46.0.0
  - org.slf4j:slf4j-api:1.7.36
  - org.slf4j:slf4j-nop:1.7.36
  - com.h2database:h2:2.1.214
commands:
  dracavetitle:
    description: 称号插件主命令
    aliases: [ dctitle, title ]
    usage: "/dctitle help"
  ttt:
    description: PlayerTitle 数据迁移（title null 静态 / title color 动态 / db 玩家数据）
    usage: "/ttt title <null|color> | /ttt db [源库路径]"
    permission: ttt.use
permissions:
  ttt.use:
    description: 允许执行 PlayerTitle 数据迁移
    default: op
  dracave.title.use:
    description: 玩家使用权限（仓库/商店/穿戴/自定义）
    default: true
  dracave.title.admin:
    description: 管理员权限（全部管理命令）
    default: op
  dracave.title.admin.panel:
    description: 管理面板权限（可视化编辑称号）
    default: op
  dracave.title.admin.upload:
    description: 称号定义上传权限（titles.yml 上传）
    default: op
  dracave.title.custom.static:
    description: 创建静态自定义称号权限
    default: false
  dracave.title.custom.dynamic:
    description: 创建动态自定义称号权限（渐变/彩虹/闪烁/帧动画）
    default: false
  dracave.title.custom.limit.1:
    description: 自定义称号数量上限 1 个
    default: false
  dracave.title.custom.limit.2:
    description: 自定义称号数量上限 2 个
    default: false
  dracave.title.custom.limit.3:
    description: 自定义称号数量上限 3 个
    default: false
  dracave.title.custom.limit.5:
    description: 自定义称号数量上限 5 个
    default: false
  dracave.title.custom.limit.10:
    description: 自定义称号数量上限 10 个
    default: false
  dracave.title.custom.limit.unlimited:
    description: 无限自定义称号
    default: op
  dracave.title.*:
    description: 全部权限
    default: op
    children:
      dracave.title.use: true
      dracave.title.admin: true
      dracave.title.admin.panel: true
      dracave.title.admin.upload: true
      dracave.title.custom.static: true
      dracave.title.custom.dynamic: true
      dracave.title.custom.limit.unlimited: true
